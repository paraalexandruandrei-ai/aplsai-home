name: Security Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run security baseline
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run operator account checks
        run: PYTHONPATH=. python tests/operator_accounts_check.py -v
      - name: Run partner access checks
        run: PYTHONPATH=. python tests/partner_access_check.py -v
      - name: Check migration setup
        run: PYTHONPATH=. python tests/migration_setup_check.py
